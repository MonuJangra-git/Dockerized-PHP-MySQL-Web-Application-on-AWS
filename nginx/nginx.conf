user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # ✅ Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name example.com www.example.com;

        return 301 https://$host$request_uri;
    }

    # ✅ HTTPS Server
    server {
        listen 443 ssl http2;
        server_name example.com www.example.com;

        # ✅ SSL Certificates (external Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # ✅ Website root (matches docker-compose volume)
        root /var/www/html;
        index index.php website.html index.html;

        # ✅ Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ✅ Main routing
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ✅ PHP-FPM Support
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;   # service name from docker-compose
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # ✅ Block hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
        }
    }
}
