services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    ports:
      - "8081:80"
    environment:
      PMA_HOST: ${DB_HOST:-mysqldb}
      PMA_PORT: ${DB_PORT:-3306}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example_root_password}
    depends_on:
      - mysqldb
    networks:
      - app-network
    restart: unless-stopped
  php:
    build: .
    container_name: php_container
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-mysqldb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-example_app_db}
      DB_USERNAME: ${DB_USERNAME:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
    volumes:
      - .:/var/www/html/
    networks:
      - app-network
  mysqldb:
    image: mysql:8.0
    container_name: mysql_container
    volumes:
      - db_data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-example_app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    networks:
      - app-network

  nginx:
    image: nginx:1.25
    container_name: mginx_container
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - .:/var/www/html/
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
volumes:
  db_data:

networks:
  app-network:
